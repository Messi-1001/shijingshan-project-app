name: 测试

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node --test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 运行测试
        run: node --test
